<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Nunma — Learning Hub</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,opsz,wght@0,6..18,600;0,6..18,700;0,6..18,800;0,6..18,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap"
    rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/index.css">
  <link rel="icon" type="image/png" href="/assets/logo-icon.png">
</head>

<body>
  <div id="root">
    <style>
      .initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #052E16; color: white;
        font-family: 'Inter', sans-serif; z-index: 9999;
      }
      .initial-spinner {
        width: 80px; height: 80px; border: 4px solid rgba(194, 245, 117, 0.2);
        border-top-color: #c2f575; border-radius: 50%; animation: spin 1s linear infinite;
        margin-bottom: 32px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <div class="initial-loader">
      <div class="initial-spinner"></div>
      <h2 style="font-size: 24px; font-weight: 800; margin: 0 0 16px 0; letter-spacing: -0.5px;">Please wait, loading...</h2>
      <p style="color: #cbd5e1; font-weight: 500; text-align: center; max-width: 400px; line-height: 1.5;">
        <span style="color: #c2f575; font-weight: bold; margin-right: 8px;">Did you know?</span>
        Nunma is built to seamlessly connect students and mentors.
      </p>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
